<title>Egy fontos kérdés ❤️</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<main id="questionScreen" class="screen">

    <div class="content">

        <div class="heart">❤️</div>

        <h1>Eljössz velem randira?</h1>

        <p class="subtitle">
            Van egy nagyon fontos kérdésem...
        </p>

        <div id="buttons">

            <button id="yesButton" class="button yes">
                IGEN ❤️
            </button>

            <button id="noButton" class="button no">
                NEM
            </button>

        </div>

    </div>

</main>

<main id="successScreen" class="screen hidden">

    <div class="successContent">

        <div class="bigHeart">💖</div>

        <h1>IGEN! 🥹❤️</h1>

        <p>
            Akkor ez egy randi. 😌
        </p>

        <p class="loveText">
            Már nagyon várom ❤️
        </p>

    </div>

</main>

<script src="script.js"></script>
```

</body>
</html>
