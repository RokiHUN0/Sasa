<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Egy fontos kérdés ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="questionScreen" class="screen">

        <div class="content">

            <div class="heart">❤️</div>

            <h1>Leszel a barátnőm?</h1>

            <p class="subtitle">
                Van egy nagyon fontos kérdésem...
            </p>

            <div id="buttons">

                <button id="yesButton" class="button yes">
                    IGEN ❤️
                </button>

                <button id="noButton" class="button no">
                    NEM
                </button>

            </div>

        </div>

    </main>


    <main id="successScreen" class="screen hidden">

        <div class="successContent">

            <div class="bigHeart">💖</div>

            <h1>TUDTAM! 🥹❤️</h1>

            <p>
                Akkor most már hivatalos. 😌
            </p>

            <p class="loveText">
                Szeretlek ❤️
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
